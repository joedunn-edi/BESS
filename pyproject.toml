[project]
name = "bess"
version = "0.1.0"
description = "Battery energy-storage arbitrage system"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=1.26",
    "pulp>=2.8,<4.0",
    "pyarrow>=16.0",
    "requests>=2.31",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bess*"]
